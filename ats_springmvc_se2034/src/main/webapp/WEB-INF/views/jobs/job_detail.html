<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
<div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ATS Platform</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Job Management</a>
                    </li>
                    <li class="nav-item dropdown ">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false" th:text="${session.user.fullName}">
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Signout</a></li>
                        </ul>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <h2 class="mt-5">JOB DETAIL</h2>
    <hr>
    <form class="mt-3" th:action="@{/jobs}" th:method="POST" th:object="${jobRequest}">
        <div class="row">
            <div class="col-md-5">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" required th:field="*{title}" placeholder="Enter job title">
                </div>
                <div class="mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" required th:field="*{location}"
                           placeholder="Enter job location">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" rows="3" th:field="*{description}"
                              placeholder="Enter job description"></textarea>
                </div>
                <div class="mb-3">
                    <label for="minSalary" class="form-label">Min Salary</label>
                    <input type="number" class="form-control" required th:field="*{minSalary}">
                </div>
                <div class="mb-3">
                    <label for="maxSalary" class="form-label">Max Salary</label>
                    <input type="number" class="form-control" th:field="*{maxSalary}">
                </div>
                <div class="mb-3">
                    <label for="utmSource" class="form-label">Utm Source</label>
                    <input type="text" class="form-control" required th:field="*{utmSource}" placeholder="Source">
                </div>
            </div>
            <div class="col-md-5">
                <div class="mb-3">
                    <label for="utmMedium" class="form-label">Utm Medium</label>
                    <input type="text" class="form-control" required th:field="*{utmMedium}" placeholder="UTM Medium">
                </div>
                <div class="mb-3">
                    <label for="deadline" class="form-label">Deadline</label>
                    <input type="date" class="form-control" required th:field="*{deadline}">
                </div>
                <div class="mb-3">
                    <label for="departmentId" class="form-label">Department</label>
                    <select class="form-select" th:field="*{departmentId}">
                        <option value="">Open this select menu</option>
                        <option th:each="dept: ${departments}" th:value="${dept.id}"
                                th:text="${dept.departmentName}">One
                        </option>
                    </select>
                </div>
                <div th:each="category:${categories}" class="mb-3">
                    <label class="form-label" th:text="${category.categoryName}"></label>
                    <div th:each="skill: ${category.skills}" class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" th:field="*{skillIds}"
                               th:value="${skill.id}">
                        <label class="form-check-label" th:text="${skill.skillName}"></label>
                    </div>
                </div>

                <button type="submit" class="btn btn-info" style="width: 15%">Save</button>
                <a th:href="@{/jobs}" class="btn btn-secondary" style="width: 15%">Close</a>
            </div>
        </div>
    </form>
</div>

</body>
</html>
